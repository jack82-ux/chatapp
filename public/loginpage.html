<!-- login.html -->
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>

    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        }

        body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f172a;
        }

        .login-box {
        background: #1e293b;
        padding: 40px;
        border-radius: 12px;
        width: 320px;
        color: white;
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .login-box h1 {
        text-align: center;
        margin-bottom: 25px;
        }

        .input-group {
        margin-bottom: 20px;
        }

        .input-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        }

        .input-group input {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        outline: none;
        background: #334155;
        color: white;
        }

        .login-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #3b82f6;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
        }

        .login-btn:hover {
        background: #2563eb;
        }
    </style>
    </head>

    <body>

    <div class="login-box">
        <h1>Chat Login/ Create account</h1>

        <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">
        </div>

        <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
        </div>

        <button class="login-btn" onclick="login()">
        Login
        </button>
    </div>

    <script>
        function login() {
        const username = document.getElementById("username").value;

        if(username.trim() === "") {
            alert("Enter username");
            return;
        }

        localStorage.setItem("username", username);

        window.location.href = "chat.html";
        }
    </script>

    </body>
    </html>
