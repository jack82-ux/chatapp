<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- FIX: mobile keyboard + no zoom issues -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

  <title>Global Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      padding: 15px;
      background: #1e293b;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
    }

    .user {
      font-size: 12px;
      opacity: 0.7;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      background: #1e293b;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .message.me {
      background: #3b82f6;
      margin-left: auto;
    }

    .username {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 3px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #1e293b;
      position: relative;
      z-index: 10;
    }

    /* 🔥 CRITICAL FIX for mobile keyboard */
    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 16px; /* IMPORTANT for iOS keyboard */
    }

    button {
      margin-left: 10px;
      padding: 12px 15px;
      border: none;
      background: #3b82f6;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    Global Chat
    <span class="user">Logged in as: <b id="me"></b></span>
  </div>

  <div id="chatBox" class="chat-box"></div>

  <div class="input-area">
    <input id="messageInput" placeholder="Type a message..." />
    <button type="button" onclick="sendMessage()">Send</button>
  </div>

</div>

<script>

const username = localStorage.getItem("username");

if (!username) {
  window.location.href = "login.html";
}

document.getElementById("me").innerText = username;

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("messageInput");

async function loadMessages() {
  try {
    const response = await fetch("https://chatapp-4blj.onrender.com/messages");
    if (!response.ok) return;

    const messages = await response.json();

    chatBox.innerHTML = "";

    messages.forEach(msg => {
      const div = document.createElement("div");
      div.classList.add("message");

      if (msg.username === username) {
        div.classList.add("me");
      }

      div.innerHTML = `
        <div class="username">${msg.username}</div>
        <div>${msg.text}</div>
      `;

      chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;

  } catch (err) {
    console.log("Load error:", err);
  }
}

async function sendMessage() {
  const text = input.value;

  if (text.trim() === "") return;

  await fetch("https://chatapp-4blj.onrender.com/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      username,
      text
    })
  });

  input.value = "";
  loadMessages();
}

// 🔥 FIX: mobile keyboard always opens
input.addEventListener("touchstart", () => {
  input.focus();
});

// Enter key support
input.addEventListener("keypress", function (e) {
  if (e.key === "Enter") sendMessage();
});

// init
loadMessages();
setInterval(loadMessages, 2000);

</script>

</body>
</html>
